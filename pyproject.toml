[project]
name = "agents-lab"
version = "0.1.0"
description = "Experiments with Pydantic AI agents and Prefect workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12.0",
    "pydantic-ai-slim[prefect]",
]

[dependency-groups]
dev = ["pre-commit"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
